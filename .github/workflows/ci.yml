name: CI

on:
  push:
    branches: [main]
  pull_request:

# LEARN: Cancel an old run when a new push comes in on the same PR.
# Avoids burning CI minutes on superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # LEARN: `pnpm -r --parallel` runs the named script in every workspace
      # that defines it, in parallel. Workspaces without the script are
      # silently skipped — so this works from Phase 0 (no workspaces yet)
      # through Phase 10 (full workspace set) with no changes.
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
